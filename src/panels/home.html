<div class="home-content">
    <aside class="sidebar">
        <div class="sidebar-top">
            <div class="player-avatar-wrapper">
                <div class="player-head"></div>
            </div>
            <div class="player-role" style="display: none;"></div>
            <div class="player-monnaie" style="display: none;"></div>
        </div>
        <div class="sidebar-middle">
            <div class="instance-selector-wrapper" id="instance-selector-wrapper">
                <button class="instance-selector-btn" id="instance-selector-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
                    <img class="instance-selector-icon" id="instance-selector-icon" alt="" style="display: none;" />
                    <svg class="instance-selector-svg" id="instance-selector-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 17 12 22 22 17"></polyline>
                        <polyline points="2 12 12 17 22 12"></polyline>
                    </svg>
                    <span class="instance-selector-corner" aria-hidden="true"></span>
                </button>
                <div class="instance-popover" id="instance-popover" role="listbox">
                    <div class="instance-popover-header" id="instance-popover-header"></div>
                    <div class="instance-popover-list" id="instance-popover-list"></div>
                </div>
            </div>
            <div class="play-element">
                <button class="play-btn" id="play-btn"></button>
                <div class="download-content">
                    <div class="text-download" id="text-download"></div>
                    <progress value="0" max="0" class="progress-bar"></progress>
                </div>
            </div>
        </div>
        <div class="sidebar-bottom">
            <button class="settings-btn icon-settings" id="settings-btn"></button>
        </div>
    </aside>

    <main class="main-content">
        <section class="news-section">
            <div class="news-list"></div>
        </section>

        <aside class="info-section">
            <div class="info-item maintenance-notice-item" id="maintenance-notice" style="display: none;">
                <div class="maintenance-notice-card">
                    <i class="fas fa-wrench maintenance-notice-icon"></i>
                    <div class="maintenance-notice-text" id="maintenance-notice-text"></div>
                </div>
            </div>
            <div class="info-item">
                <div class="server">
                    <img class="server-img" />
                    <div class="server-text">
                        <div class="name" id="server-name"></div>
                        <div class="desc" id="server-desc"></div>
                    </div>
                    <div class="etat-text">
                        <div class="text" id="players-connected"></div>
                        <div class="online off"></div>
                    </div>
                </div>
            </div>
            <div class="info-item ytb-container">
                <div class="ytb">
                    <div class="ytb-header">
                        <div class="header-text">
                            <div class="title-change" id="video-title"></div>
                        </div>
                    </div>
                    <div class="video">
                        <div class="youtube-thumbnail">
                            <img class="thumbnail-img" alt="YouTube Thumbnail" />
                            <button class="ytb-play-btn" id="play-video-btn"></button>
                        </div>
                        <div class="video-credits"></div>
                        <div class="icon-ytb ytb-btn" id="view-video-btn"></div>
                    </div>
                </div>
            </div>
        </aside>

        <div class="advert-banner" id="advert-banner" style="display:none;"></div>
    </main>
</div>
