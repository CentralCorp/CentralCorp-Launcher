[package]
name = "centralcorp-launcher"
version = "5.0.0"
description = "CentralCorp Desktop Minecraft Launcher (Tauri v2 + Rust)"
authors = ["CentralCorp", "Riptiaz", "Boulldogo", "Vexato", "Luuxis"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "centralcorp_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
minecraft-rust-core = { path = "../../minecraft-rust-core" }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
dirs = "5.0"
discord-rich-presence = "0.2"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "gzip",
] }
roxmltree = "0.20"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
tokio = { version = "1.40", default-features = false, features = ["rt", "sync", "macros", "time"] }
tracing = "0.1"
url = "2.5"

[dev-dependencies]
hex = "0.4"
sha1 = "0.10"
tempfile = "3.13"
tokio = { version = "1.40", default-features = false, features = ["rt-multi-thread", "net", "io-util", "macros"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"
